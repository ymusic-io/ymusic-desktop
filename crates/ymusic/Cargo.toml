[package]
name = "ymusic"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui-kit.workspace = true
ym-common = { path = "../ym-common" }
ym-engine = { path = "../ym-engine" }
ym-i18n = { path = "../ym-i18n" }
ym-settings = { path = "../ym-settings" }
ym-mse = { path = "../ym-mse" }
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
bytes.workspace = true
futures.workspace = true
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
thiserror.workspace = true
url.workspace = true
log = "0.4"
dirs = "6"
souvlaki = { version = "0.9", default-features = false }
raw-window-handle = "0.6"
ym-store = { path = "../ym-store" }
ym-remote-config = { path = "../ym-remote-config" }
ym-logstore = { path = "../ym-logstore" }
ym-signin = { path = "../ym-signin" }
ym-telemetry = { path = "../ym-telemetry" }
ym-download = { path = "../ym-download" }
ym-ytmedia = { path = "../ym-ytmedia" }
ym-history = { path = "../ym-history" }
qrcode = { version = "0.14", default-features = false }
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
rfd = { version = "0.15", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }

[lints]
workspace = true
