[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
gpui-kit = "=0.9.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "fs", "io-util"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "gzip", "stream", "charset", "system-proxy"] }
bytes = "1"
futures = "0.3"
url = "2"
rusqlite = { version = "0.41", features = ["bundled"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
# Symbols stay: Sentry names panic frames from them in-process (no dSYM upload yet).
strip = "debuginfo"
